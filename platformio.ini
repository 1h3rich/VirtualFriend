; Archivo de configuración de PlatformIO para VirtualFriend
; PlatformIO es una herramienta que permite compilar y subir código a placas
; como la K128 (basada en ESP32) sin necesidad de instalar todo manualmente.
;
; [env:k128] define el entorno de compilación.
; platform = espressif32 → la familia de chips ESP32
; board = esp32dev → una placa genérica ESP32, compatible con K128
; framework = arduino → usamos el estilo Arduino (setup + loop)
; monitor_speed = 115200 → velocidad del Monitor Serie (debe coincidir con el código)

[env:k128]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Necesario para que Wokwi pueda simular el firmware correctamente.
; Genera el archivo .elf con información de depuración completa.
build_type = debug
