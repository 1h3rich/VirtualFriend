; VirtualFriend — copiloto virtual sobre M5Stack CoreS3
;
; Hardware:   M5Stack CoreS3 (ESP32-S3, pantalla tactil, AW88298 + ES7210, microSD, IMU)
; Framework:  Arduino (via PlatformIO)
;
; Para compilar:    pio run
; Para subir:       pio run --target upload
; Monitor serie:    pio device monitor
;
; El puerto ttyACM* puede cambiar segun el orden de conexion USB.

[env:m5stack-cores3]
platform                          = espressif32
board                             = m5stack-cores3
framework                         = arduino
monitor_speed                     = 115200
upload_port                       = /dev/ttyACM0
monitor_port                      = /dev/ttyACM0
board_build.arduino.memory_type   = qio_qspi
build_flags                       = -DCORE_DEBUG_LEVEL=0
lib_deps =
    m5stack/M5Unified @ ^0.2.0
    m5stack/M5GFX @ ^0.2.0
    bitbank2/AnimatedGIF @ ^2.1.1
    h2zero/NimBLE-Arduino @ ^1.4.2
