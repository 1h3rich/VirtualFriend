# Configuración de Wokwi para VirtualFriend
#
# Este archivo le dice a la extensión de Wokwi en VS Code
# dónde encontrar el firmware compilado por PlatformIO.
#
# Flujo de trabajo:
#   1. PlatformIO compila el código → genera firmware.elf y firmware.bin
#   2. Wokwi carga ese firmware y lo simula en un ESP32 virtual
#
# El nombre "k128" debe coincidir con el [env:k128] de platformio.ini

[wokwi]
version = 1
elf = ".pio/build/k128/firmware.elf"
firmware = ".pio/build/k128/firmware.bin"
