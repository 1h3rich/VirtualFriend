; VirtualFriend — dongle OBD2 (maquina de diagnosis)
;
; Hardware:   ESP32-C3 + transceptor CAN SN65HVD230
;             Alimentado desde el pin 16 del OBD2 via DC-DC 12V->5V + fusible 1A
; Framework:  Arduino (via PlatformIO)
;
; Para compilar:    pio run
; Para subir:       pio run --target upload
; Monitor serie:    pio device monitor

[env:esp32-c3]
platform      = espressif32
board         = esp32-c3-devkitm-1
framework     = arduino
monitor_speed = 115200
build_flags   = -DCORE_DEBUG_LEVEL=0
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2
